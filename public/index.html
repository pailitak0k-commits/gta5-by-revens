<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PlayGTA5</title>
  <style>
    :root {
      --bg: #070b0d;
      --panel: rgba(18, 25, 28, 0.95);
      --panel-2: rgba(14, 18, 22, 0.96);
      --line: rgba(255,255,255,0.08);
      --text: #edf5fb;
      --muted: #a9bbca;
      --green: #7de168;
      --gold: #f2c768;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(87,169,255,0.12), transparent 28%), linear-gradient(180deg, #0b0f12 0%, #070b0d 100%);
      color: var(--text);
      font: 17px/1.5 system-ui, sans-serif;
    }
    .wrap {
      width: min(560px, calc(100% - 30px));
      background: linear-gradient(180deg, rgba(18,25,28,0.96), rgba(9,12,15,0.96));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.1rem, 5vw, 3.6rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
    }
    .button {
      appearance: none;
      border: none;
      border-radius: 12px;
      min-height: 48px;
      padding: 0 22px;
      font: 800 0.98rem/1.1 system-ui, sans-serif;
      background: linear-gradient(180deg, #8fe078, #5fbe5e);
      color: #0a140d;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s ease;
    }
    .button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PLAYGTA5</h1>
    <p>Opening the game in this tab…</p>
    <a class="button" href="https://gta5-87g.pages.dev/" target="_self">Open game</a>
  </div>

  <script>
    const targetUrl = 'https://gta5-87g.pages.dev/';
    window.location.replace(targetUrl);
  </script>
</body>
</html>

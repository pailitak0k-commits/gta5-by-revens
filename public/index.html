<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Theft Auto V</title>
<style>
  :root {
    --bg-1: #060b10;
    --bg-2: #10161b;
    --surface: rgba(9, 12, 16, 0.8);
    --surface-2: rgba(13, 15, 20, 0.74);
    --line: rgba(255,255,255,0.08);
    --text: #eef4fa;
    --muted: rgba(255,255,255,0.72);
    --muted-2: rgba(255,255,255,0.5);
    --green: #82f274;
    --green-2: #54d069;
    --blue: #64c7ff;
    --gold: #f3d488;
    --shadow: rgba(0,0,0,0.65);
    --danger: #ff8b7d;
    --panel-soft: rgba(255,255,255,0.03);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at top, rgba(83,138,255,0.16), transparent 18%),
      linear-gradient(180deg, #010305, #091117 40%, #04070b 100%);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .game-shell {
    position: relative;
    width: min(980px, 100%);
    height: min(650px, 82vh);
    background: #060910;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }

  .bg-image {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.2) 26%, rgba(0,0,0,0.66) 70%, rgba(0,0,0,0.9) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 22%, rgba(0,0,0,0.16) 100%),
      url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    filter: saturate(0.9) contrast(1.05) brightness(0.72);
    transform: scale(1.08);
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 22%);
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 8px;
    background: rgba(4, 6, 9, 0.12);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .brand-wrap { display: flex; align-items: center; gap: 12px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }

  .brand-mark {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 5px;
    background: linear-gradient(135deg, #4ec4ff, #2f78ff);
    box-shadow: 0 0 14px rgba(78,196,255,0.25);
  }

  .brand-mark::before,
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 1.5px;
    background: rgba(255,255,255,0.9);
  }

  .brand-mark::before { width: 2px; height: 100%; }
  .brand-mark::after { width: 100%; height: 2px; }

  .nav-pills {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: 6px;
  }

  .nav-pill {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.78);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    cursor: pointer;
  }

  .nav-pill.active {
    background: rgba(100,199,255,0.12);
    color: var(--text);
    border-color: rgba(100,199,255,0.2);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7ef9a4;
    box-shadow: 0 0 12px rgba(126,249,164,0.8);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: calc(100% - 42px);
  }

  .hero-stage {
    position: relative;
    flex: 1;
    padding: 18px 18px 0;
  }

  .title {
    position: absolute;
    left: 18px;
    bottom: 136px;
    font-weight: 900;
    font-size: clamp(2.4rem, 4vw, 4rem);
    line-height: 0.86;
    letter-spacing: -0.08em;
    text-shadow: 0 10px 26px rgba(0,0,0,0.7);
    max-width: 460px;
  }

  .badge-row {
    position: absolute;
    left: 18px;
    bottom: 90px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(8, 9, 13, 0.26);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(7px);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }

  .play-btn {
    position: absolute;
    left: 18px;
    bottom: 18px;
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-width: 148px;
    min-height: 46px;
    padding: 0 20px;
    background: linear-gradient(180deg, #9ae269, #4ccf68);
    color: rgba(9, 11, 15, 0.9);
    font: 800 1rem/1 system-ui, sans-serif;
    box-shadow: 0 14px 28px rgba(76,207,104,0.32);
    cursor: pointer;
  }

  .right-stack {
    position: absolute;
    right: 18px;
    bottom: 16px;
    display: grid;
    gap: 12px;
    width: 180px;
  }

  .mini-card {
    position: relative;
    min-height: 92px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background:
      linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.48)),
      url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
    box-shadow: 0 20px 30px rgba(0,0,0,0.18);
  }

  .mini-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.68));
  }

  .mini-card span {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 1;
    font-size: 0.74rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  .mini-card.alt {
    background:
      linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.48)),
      url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
  }

  .bottom-bar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px 14px;
    background: rgba(8, 10, 12, 0.42);
    border-top: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
  }

  .left-stack,
  .right-stack-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 144px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
  }

  .tile-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7ee5d0, #5ca2ff);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .tile-icon.gold {
    background: linear-gradient(135deg, #f7e58b, #e9a82f);
  }

  .tile-meta { min-width: 0; }

  .tile-title {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.94);
    font-weight: 700;
    white-space: nowrap;
  }

  .tile-sub {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.62);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.76);
    white-space: nowrap;
  }

  .status-pill .small-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7ef9a4;
    display: inline-block;
  }

  .welcome-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 7, 11, 0.72);
    backdrop-filter: blur(9px);
    z-index: 30;
    padding: 18px;
  }

  .welcome-overlay.hidden { display: none; }

  .welcome-card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, rgba(12, 18, 24, 0.98), rgba(7, 10, 14, 0.98));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px 20px 18px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.5);
  }

  .welcome-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(80, 186, 255, 0.12);
    border: 1px solid rgba(80, 186, 255, 0.22);
    color: #8ed4ff;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 900;
  }

  .welcome-card h2 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 4vw, 2.8rem);
    letter-spacing: -0.08em;
    line-height: 0.96;
  }

  .welcome-card p {
    margin: 0 0 18px;
    color: rgba(255,255,255,0.74);
  }

  .field {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .field label {
    color: rgba(255,255,255,0.7);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 800;
  }

  .field input {
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--text);
    font-weight: 700;
    outline: none;
  }

  .field input:focus {
    border-color: rgba(100, 199, 255, 0.8);
    box-shadow: 0 0 0 3px rgba(100, 199, 255, 0.12);
  }

  .welcome-actions {
    display: flex;
    justify-content: flex-end;
  }

  .primary-btn {
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-height: 42px;
    padding: 0 18px;
    color: #08161e;
    background: linear-gradient(180deg, #7fe9ff, #2da3ff 64%, #2458d1);
    font: 800 0.92rem/1 system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(45,163,255,0.26);
  }

  @media (max-width: 760px) {
    .game-shell { height: 560px; }
    .title { bottom: 120px; }
    .badge-row { bottom: 70px; }
    .right-stack { width: 140px; }
    .bottom-bar { flex-direction: column; align-items: flex-start; }
    .right-stack-mini { width: 100%; justify-content: flex-start; }
  }
</style>

<div class="welcome-overlay" id="username-overlay">
  <div class="welcome-card">
    <div class="welcome-badge">PS5</div>
    <h2>Welcome</h2>
    <p>Choose a username to personalize your console.</p>
    <div class="field">
      <label for="username-input">Username</label>
      <input id="username-input" type="text" maxlength="18" placeholder="Enter your username" autocomplete="off">
    </div>
    <div class="welcome-actions">
      <button class="primary-btn" id="save-username-btn" type="button">Continue</button>
    </div>
  </div>
</div>

<div id="home-view" class="game-shell">
  <div class="bg-image"></div>
  <div class="vignette"></div>

  <div class="topbar">
    <div class="brand-wrap">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>PS5</span>
      </div>
      <div class="nav-pills">
        <button class="nav-pill active" type="button" id="home-btn">Home</button>
        <button class="nav-pill" type="button" id="media-btn">Media</button>
      </div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>

  <div class="content">
    <div class="hero-stage">
      <div class="title">Grand<br>Theft Auto V</div>
      <div class="badge-row">GTA • Open World</div>
      <button class="play-btn" type="button">PLAY</button>

      <div class="right-stack">
        <div class="mini-card"><span>GTA V</span></div>
        <div class="mini-card alt"><span>Details</span></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="left-stack">
        <div class="tile">
          <span class="tile-icon"></span>
          <div class="tile-meta">
            <span class="tile-title">Trophäen</span>
            <span class="tile-sub">3/3</span>
          </div>
        </div>
        <div class="tile">
          <span class="tile-icon gold"></span>
          <div class="tile-meta">
            <span class="tile-title">Freunde</span>
            <span class="tile-sub">2 online</span>
          </div>
        </div>
      </div>

      <div class="right-stack-mini">
        <div class="status-pill"><span class="small-dot"></span> Freunde, die spielen</div>
      </div>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById('username-overlay');
  const usernameInput = document.getElementById('username-input');
  const saveUsernameBtn = document.getElementById('save-username-btn');

  function setUsername(value) {
    const name = (value || '').trim() || 'Player';
    localStorage.setItem('ps5-username', name);
  }

  function submitUsername() {
    const value = usernameInput.value;
    if (!value.trim()) {
      usernameInput.focus();
      usernameInput.placeholder = 'Please enter a username';
      return;
    }
    setUsername(value);
    overlay.classList.add('hidden');
  }

  const storedUsername = localStorage.getItem('ps5-username');
  if (storedUsername) {
    setUsername(storedUsername);
    overlay.classList.add('hidden');
  } else {
    usernameInput.focus();
  }

  saveUsernameBtn.addEventListener('click', submitUsername);
  usernameInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') submitUsername();
  });
</script>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Theft Auto V</title>
<style>
  :root {
    --bg-1: #060b10;
    --bg-2: #10161b;
    --surface: rgba(9, 12, 16, 0.8);
    --surface-2: rgba(13, 15, 20, 0.74);
    --line: rgba(255,255,255,0.08);
    --text: #eef4fa;
    --muted: rgba(255,255,255,0.72);
    --muted-2: rgba(255,255,255,0.5);
    --green: #82f274;
    --green-2: #54d069;
    --blue: #64c7ff;
    --gold: #f3d488;
    --shadow: rgba(0,0,0,0.65);
    --danger: #ff8b7d;
    --panel-soft: rgba(255,255,255,0.03);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at top, rgba(83,138,255,0.16), transparent 18%),
      linear-gradient(180deg, #010305, #091117 40%, #04070b 100%);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .game-shell {
    position: relative;
    width: min(980px, 100%);
    height: min(650px, 82vh);
    background: #060910;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }

  .bg-image {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.2) 26%, rgba(0,0,0,0.66) 70%, rgba(0,0,0,0.9) 100%),
      linear-gradient(90deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 22%, rgba(0,0,0,0.16) 100%),
      url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    filter: saturate(0.9) contrast(1.05) brightness(0.72);
    transform: scale(1.08);
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 22%);
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 8px;
    background: rgba(4, 6, 9, 0.12);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }

  .brand-mark {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 5px;
    background: linear-gradient(135deg, #4ec4ff, #2f78ff);
    box-shadow: 0 0 14px rgba(78,196,255,0.25);
  }

  .brand-mark::before,
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 1.5px;
    background: rgba(255,255,255,0.9);
  }

  .brand-mark::before { width: 2px; height: 100%; }
  .brand-mark::after { width: 100%; height: 2px; }

  .nav-pills {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: 6px;
  }

  .nav-pill {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.78);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
    cursor: pointer;
  }

  .nav-pill.active {
    background: rgba(100,199,255,0.12);
    color: var(--text);
    border-color: rgba(100,199,255,0.2);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7ef9a4;
    box-shadow: 0 0 12px rgba(126,249,164,0.8);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: calc(100% - 42px);
  }

  .hero-stage {
    position: relative;
    flex: 1;
    padding: 18px 18px 0;
  }

  .title {
    position: absolute;
    left: 18px;
    bottom: 136px;
    font-weight: 900;
    font-size: clamp(2.4rem, 4vw, 4rem);
    line-height: 0.86;
    letter-spacing: -0.08em;
    text-shadow: 0 10px 26px rgba(0,0,0,0.7);
    max-width: 460px;
  }

  .badge-row {
    position: absolute;
    left: 18px;
    bottom: 90px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(8, 9, 13, 0.26);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(7px);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }

  .play-btn {
    position: absolute;
    left: 18px;
    bottom: 18px;
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-width: 148px;
    min-height: 46px;
    padding: 0 20px;
    background: linear-gradient(180deg, #9ae269, #4ccf68);
    color: rgba(9, 11, 15, 0.9);
    font: 800 1rem/1 system-ui, sans-serif;
    box-shadow: 0 14px 28px rgba(76,207,104,0.32);
    cursor: pointer;
  }

  .right-stack {
    position: absolute;
    right: 18px;
    bottom: 16px;
    display: grid;
    gap: 12px;
    width: 180px;
  }

  .mini-card {
    position: relative;
    min-height: 92px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    background:
      linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.48)),
      url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
    box-shadow: 0 20px 30px rgba(0,0,0,0.18);
  }

  .mini-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.68));
  }

  .mini-card span {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 1;
    font-size: 0.74rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  .mini-card.alt {
    background:
      linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.48)),
      url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=700&q=80') center/cover no-repeat;
  }

  .bottom-bar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px 14px;
    background: rgba(8, 10, 12, 0.42);
    border-top: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
  }

  .left-stack,
  .right-stack-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 144px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
  }

  .tile-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7ee5d0, #5ca2ff);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .tile-icon.gold {
    background: linear-gradient(135deg, #f7e58b, #e9a82f);
  }

  .tile-meta {
    min-width: 0;
  }

  .tile-title {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.94);
    font-weight: 700;
    white-space: nowrap;
  }

  .tile-sub {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.62);
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.76);
    white-space: nowrap;
  }

  .status-pill .small-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7ef9a4;
    display: inline-block;
  }

  .welcome-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 7, 11, 0.72);
    backdrop-filter: blur(9px);
    z-index: 30;
    padding: 18px;
  }

  .welcome-overlay.hidden { display: none; }

  .welcome-card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, rgba(12, 18, 24, 0.98), rgba(7, 10, 14, 0.98));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px 20px 18px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.5);
  }

  .welcome-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(80, 186, 255, 0.12);
    border: 1px solid rgba(80, 186, 255, 0.22);
    color: #8ed4ff;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 900;
  }

  .welcome-card h2 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 4vw, 2.8rem);
    letter-spacing: -0.08em;
    line-height: 0.96;
  }

  .welcome-card p {
    margin: 0 0 18px;
    color: rgba(255,255,255,0.74);
  }

  .field {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .field label {
    color: rgba(255,255,255,0.7);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 800;
  }

  .field input {
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--text);
    font-weight: 700;
    outline: none;
  }

  .field input:focus {
    border-color: rgba(100, 199, 255, 0.8);
    box-shadow: 0 0 0 3px rgba(100, 199, 255, 0.12);
  }

  .welcome-actions {
    display: flex;
    justify-content: flex-end;
  }

  .primary-btn {
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-height: 42px;
    padding: 0 18px;
    color: #08161e;
    background: linear-gradient(180deg, #7fe9ff, #2da3ff 64%, #2458d1);
    font: 800 0.92rem/1 system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(45,163,255,0.26);
  }

  .media-view {
    display: none;
    position: relative;
    z-index: 2;
    width: min(980px, 100%);
    min-height: 650px;
    background: linear-gradient(180deg, rgba(11,14,18,.96), rgba(5,8,11,.98));
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
  }

  .media-view.visible { display: block; }

  .media-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(9, 12, 18, 0.84);
  }

  .media-title {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 900;
  }

  .owner-code-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 8px 12px;
  }

  .owner-code-box label {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.7);
  }

  .owner-code-box input {
    width: 140px;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-weight: 800;
  }

  .media-body {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 560px;
  }

  .channel-sidebar {
    background: rgba(255,255,255,.02);
    border-right: 1px solid rgba(255,255,255,.08);
    padding: 18px 14px;
  }

  .channel-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-weight: 800;
    cursor: pointer;
    text-align: left;
    margin-bottom: 8px;
  }

  .channel-btn.active {
    background: rgba(255,255,255,.04);
    border-color: rgba(255,255,255,.08);
  }

  .channel-btn span:last-child {
    color: rgba(255,255,255,.6);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }

  .channel-panel {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 560px;
    background: rgba(4, 7, 10, 0.52);
  }

  .channel-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }

  .channel-name {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 900;
  }

  .channel-lock {
    color: rgba(255,255,255,.65);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .messages {
    padding: 16px 18px 8px;
    overflow: auto;
    display: grid;
    gap: 14px;
    align-content: start;
  }

  .message {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px;
    padding: 12px 12px 10px;
  }

  .message-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .meta-line {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7bb5ff, #73e8d0);
    color: #04121a;
    font-weight: 900;
    font-size: 0.76rem;
  }

  .author {
    font-weight: 800;
    font-size: 0.82rem;
  }

  .owner-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 0.56rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 900;
    color: #03171b;
    background: linear-gradient(180deg, #ffd76a, #f4bb42);
  }

  .message-time {
    color: rgba(255,255,255,.56);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .message-body {
    color: rgba(255,255,255,.9);
    font-size: 0.92rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message-image {
    display: block;
    margin-top: 10px;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
  }

  .comment-toggle {
    margin-top: 12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    color: rgba(255,255,255,.8);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    cursor: pointer;
  }

  .comments-box {
    margin-top: 10px;
    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 10px;
    display: none;
  }

  .comments-box.visible { display: block; }

  .comment-list {
    display: grid;
    gap: 8px;
    margin-bottom: 10px;
  }

  .comment {
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.05);
    padding: 8px 9px;
    color: rgba(255,255,255,.8);
    font-size: 0.8rem;
  }

  .comment strong {
    color: var(--text);
  }

  .comment-form {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .comment-form input {
    flex: 1;
    min-height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color: var(--text);
    padding: 0 10px;
    outline: none;
  }

  .comment-form button {
    min-height: 36px;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    color: var(--text);
    padding: 0 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .composer {
    padding: 14px 18px 18px;
    border-top: 1px solid rgba(255,255,255,.06);
    background: rgba(9, 12, 18, 0.86);
  }

  .composer-inner {
    display: grid;
    gap: 10px;
  }

  .composer-row {
    display: flex;
    gap: 10px;
  }

  .composer textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color: var(--text);
    font: 600 0.9rem/1.5 system-ui, sans-serif;
    padding: 12px 14px;
    outline: none;
  }

  .composer textarea:focus {
    border-color: rgba(100,199,255,.7);
    box-shadow: 0 0 0 3px rgba(100,199,255,.08);
  }

  .composer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .upload-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,.74);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .upload-wrap input {
    display: none;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
  }

  .send-btn {
    min-height: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, #7fe9ff, #2da3ff 64%, #2458d1);
    color: #07131c;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(45,163,255,0.3);
  }

  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .notice {
    color: var(--danger);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    min-height: 1em;
  }

  .empty-state {
    color: rgba(255,255,255,.65);
    border: 1px dashed rgba(255,255,255,.12);
    padding: 26px 18px;
    border-radius: 14px;
    text-align: center;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @media (max-width: 760px) {
    .game-shell { height: 560px; }
    .title { bottom: 120px; }
    .badge-row { bottom: 70px; }
    .right-stack { width: 140px; }
    .bottom-bar { flex-direction: column; align-items: flex-start; }
    .right-stack-mini { width: 100%; justify-content: flex-start; }
    .media-body { grid-template-columns: 1fr; }
    .channel-sidebar { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .owner-code-box { width: 100%; }
    .owner-code-box input { width: 100%; }
  }
</style>

<div class="welcome-overlay" id="username-overlay">
  <div class="welcome-card">
    <div class="welcome-badge">PS5</div>
    <h2>Welcome</h2>
    <p>Choose a username to personalize your console.</p>
    <div class="field">
      <label for="username-input">Username</label>
      <input id="username-input" type="text" maxlength="18" placeholder="Enter your username" autocomplete="off">
    </div>
    <div class="welcome-actions">
      <button class="primary-btn" id="save-username-btn" type="button">Continue</button>
    </div>
  </div>
</div>

<div id="home-view" class="game-shell">
  <div class="bg-image"></div>
  <div class="vignette"></div>

  <div class="topbar">
    <div class="brand-wrap">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>PS5</span>
      </div>
      <div class="nav-pills">
        <button class="nav-pill active" type="button" id="home-btn">Home</button>
        <button class="nav-pill" type="button" id="media-btn">Media</button>
      </div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>

  <div class="content">
    <div class="hero-stage">
      <div class="title">Grand<br>Theft Auto V</div>
      <div class="badge-row">GTA • Open World</div>
      <button class="play-btn" type="button">Spielen</button>

      <div class="right-stack">
        <div class="mini-card"><span>GTA V</span></div>
        <div class="mini-card alt"><span>Details</span></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="left-stack">
        <div class="tile">
          <span class="tile-icon"></span>
          <div class="tile-meta">
            <span class="tile-title">Trophäen</span>
            <span class="tile-sub">3/3</span>
          </div>
        </div>
        <div class="tile">
          <span class="tile-icon gold"></span>
          <div class="tile-meta">
            <span class="tile-title">Freunde</span>
            <span class="tile-sub">2 online</span>
          </div>
        </div>
      </div>

      <div class="right-stack-mini">
        <div class="status-pill"><span class="small-dot"></span> Freunde, die spielen</div>
      </div>
    </div>
  </div>
</div>

<div id="media-view" class="media-view" aria-live="polite">
  <div class="media-header">
    <div class="media-title">Media</div>
    <div class="owner-code-box">
      <label for="owner-code-input">Owner code</label>
      <input id="owner-code-input" type="password" maxlength="20" placeholder="revensgg" autocomplete="off">
    </div>
  </div>

  <div class="media-body">
    <aside class="channel-sidebar">
      <button class="channel-btn active" data-channel="update" type="button"><span>Update</span><span>Owner</span></button>
      <button class="channel-btn" data-channel="bug" type="button"><span>Bug</span><span>Public</span></button>
    </aside>

    <div class="channel-panel">
      <div class="channel-top">
        <div class="channel-name" id="active-channel-label">Update channel</div>
        <div class="channel-lock" id="channel-lock">Owners only</div>
      </div>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer-form">
        <div class="composer-inner">
          <div class="composer-row">
            <textarea id="message-input" placeholder="Write a message..." maxlength="500"></textarea>
          </div>
          <div class="composer-actions">
            <div class="upload-wrap">
              <label class="upload-btn" for="image-upload">Add image</label>
              <input id="image-upload" type="file" accept="image/*">
              <span id="image-name">No image</span>
            </div>
            <button class="send-btn" id="send-btn" type="submit">Send</button>
          </div>
          <div class="notice" id="notice"></div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'ps5_media_messages_v1';
  const OWNER_CODE = 'revensgg';

  const homeView = document.getElementById('home-view');
  const mediaView = document.getElementById('media-view');
  const mediaBtn = document.getElementById('media-btn');
  const homeBtn = document.getElementById('home-btn');

  const overlay = document.getElementById('username-overlay');
  const usernameInput = document.getElementById('username-input');
  const saveUsernameBtn = document.getElementById('save-username-btn');
  const ownerCodeInput = document.getElementById('owner-code-input');
  const channelButtons = document.querySelectorAll('.channel-btn');
  const messagesEl = document.getElementById('messages');
  const messageInput = document.getElementById('message-input');
  const imageUpload = document.getElementById('image-upload');
  const imageName = document.getElementById('image-name');
  const noticeEl = document.getElementById('notice');
  const activeChannelLabel = document.getElementById('active-channel-label');
  const channelLock = document.getElementById('channel-lock');
  const composerForm = document.getElementById('composer-form');

  let activeChannel = 'update';
  let selectedImageData = '';

  function getStoredUsername() {
    return localStorage.getItem('ps5-username') || 'Player';
  }

  function getOwnerCode() {
    return (localStorage.getItem('ps5-owner-code') || '').trim();
  }

  function setOwnerCode(value) {
    localStorage.setItem('ps5-owner-code', value.trim());
  }

  function isOwnerCodeValid(code) {
    return (code || '').trim().toLowerCase() === OWNER_CODE;
  }

  function createDefaultMessages() {
    return {
      update: [
        {
          id: 'seed-update-1',
          author: 'Owner',
          text: 'Welcome to the update channel. Owner-only updates will appear here.',
          owner: true,
          timestamp: Date.now() - 900000,
          image: '',
          comments: [
            { id: 'seed-comment-1', author: 'Player', text: 'Nice! Keep it up.', timestamp: Date.now() - 600000 }
          ]
        }
      ],
      bug: [
        {
          id: 'seed-bug-1',
          author: 'Player',
          text: 'Some textures look blurry on low settings. Can someone check?',
          owner: false,
          timestamp: Date.now() - 1200000,
          image: '',
          comments: [
            { id: 'seed-comment-2', author: 'Owner', text: 'Thanks, we are checking the shader fix.', timestamp: Date.now() - 900000 }
          ]
        }
      ]
    };
  }

  function loadMessages() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultMessages();
      const parsed = JSON.parse(raw);
      if (parsed && parsed.update && parsed.bug) return parsed;
    } catch (e) {}
    return createDefaultMessages();
  }

  let messages = loadMessages();

  function saveMessages() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
  }

  function formatTime(ts) {
    const date = new Date(ts);
    return new Intl.DateTimeFormat('en', {
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit'
    }).format(date);
  }

  function openHome() {
    homeView.style.display = 'block';
    mediaView.classList.remove('visible');
    homeBtn.classList.add('active');
    mediaBtn.classList.remove('active');
  }

  function openMedia() {
    homeView.style.display = 'none';
    mediaView.classList.add('visible');
    mediaBtn.classList.add('active');
    homeBtn.classList.remove('active');
  }

  function renderMessages() {
    const items = messages[activeChannel] || [];
    messagesEl.innerHTML = '';

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = activeChannel === 'update' ? 'No owner updates yet' : 'No bug reports yet';
      messagesEl.appendChild(empty);
      return;
    }

    items.forEach((item) => {
      const card = document.createElement('article');
      card.className = 'message';

      const head = document.createElement('div');
      head.className = 'message-head';
      head.innerHTML = `
        <div class="meta-line">
          <span class="avatar">${(item.author || 'U').charAt(0).toUpperCase()}</span>
          <span class="author">${escapeHtml(item.author || 'Player')}</span>
          ${item.owner ? '<span class="owner-badge">Owner</span>' : ''}
        </div>
        <span class="message-time">${formatTime(item.timestamp || Date.now())}</span>
      `;

      const body = document.createElement('div');
      body.className = 'message-body';
      body.textContent = item.text || '';

      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'comment-toggle';
      action.textContent = `Comments (${(item.comments || []).length})`;

      const commentsBox = document.createElement('div');
      commentsBox.className = 'comments-box';

      const commentList = document.createElement('div');
      commentList.className = 'comment-list';
      (item.comments || []).forEach((comment) => {
        const commentEl = document.createElement('div');
        commentEl.className = 'comment';
        commentEl.innerHTML = `<strong>${escapeHtml(comment.author || 'Player')}</strong> · ${escapeHtml(comment.text || '')}`;
        commentList.appendChild(commentEl);
      });

      const form = document.createElement('form');
      form.className = 'comment-form';
      form.innerHTML = `
        <input type="text" maxlength="180" aria-label="Write a comment" placeholder="Write a comment...">
        <button type="submit">Reply</button>
      `;

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const input = form.querySelector('input');
        const value = (input.value || '').trim();
        if (!value) return;
        if (!item.comments) item.comments = [];
        item.comments.push({
          id: `comment-${Date.now()}`,
          author: getStoredUsername(),
          text: value,
          timestamp: Date.now()
        });
        saveMessages();
        renderMessages();
      });

      action.addEventListener('click', () => {
        commentsBox.classList.toggle('visible');
      });

      commentsBox.appendChild(commentList);
      commentsBox.appendChild(form);

      if (item.image) {
        const img = document.createElement('img');
        img.className = 'message-image';
        img.src = item.image;
        img.alt = 'Uploaded message image';
        body.appendChild(img);
      }

      card.appendChild(head);
      card.appendChild(body);
      card.appendChild(action);
      card.appendChild(commentsBox);
      messagesEl.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function updateChannelState() {
    const isUpdate = activeChannel === 'update';
    activeChannelLabel.textContent = isUpdate ? 'Update channel' : 'Bug channel';
    channelLock.textContent = isUpdate ? 'Owners only' : 'Public';
    channelButtons.forEach((button) => {
      button.classList.toggle('active', button.dataset.channel === activeChannel);
    });

    const isOwner = isOwnerCodeValid(ownerCodeInput.value);
    document.getElementById('send-btn').disabled = isUpdate && !isOwner;
    noticeEl.textContent = isUpdate && !isOwner ? 'Owner code required for update channel.' : '';
  }

  function handleChannelChange(channel) {
    activeChannel = channel;
    updateChannelState();
    renderMessages();
  }

  function handleMessageSubmit(event) {
    event.preventDefault();

    const text = messageInput.value.trim();
    const ownerCode = ownerCodeInput.value.trim();
    const isOwner = isOwnerCodeValid(ownerCode);
    if (activeChannel === 'update' && !isOwner) {
      noticeEl.textContent = 'Owner code required for update channel.';
      return;
    }

    if (!text && !selectedImageData) {
      noticeEl.textContent = 'Type a message or add an image.';
      return;
    }

    const message = {
      id: `msg-${Date.now()}`,
      author: getStoredUsername(),
      text,
      owner: isOwner,
      timestamp: Date.now(),
      image: selectedImageData || '',
      comments: []
    };

    messages[activeChannel] = [message, ...(messages[activeChannel] || [])];
    saveMessages();
    renderMessages();
    messageInput.value = '';
    imageUpload.value = '';
    selectedImageData = '';
    imageName.textContent = 'No image';
    noticeEl.textContent = '';
  }

  function processImage(file) {
    if (!file) {
      selectedImageData = '';
      imageName.textContent = 'No image';
      return;
    }

    const reader = new FileReader();
    reader.onload = function () {
      selectedImageData = reader.result;
      imageName.textContent = file.name;
    };
    reader.readAsDataURL(file);
  }

  function initializeUi() {
    const savedCode = getOwnerCode();
    ownerCodeInput.value = savedCode || '';
    ownerCodeInput.addEventListener('input', () => {
      const code = ownerCodeInput.value.trim();
      setOwnerCode(code);
      updateChannelState();
    });

    channelButtons.forEach((button) => {
      button.addEventListener('click', () => handleChannelChange(button.dataset.channel));
    });

    imageUpload.addEventListener('change', (event) => processImage(event.target.files[0]));
    composerForm.addEventListener('submit', handleMessageSubmit);

    if (!savedCode && OWNER_CODE) {
      ownerCodeInput.placeholder = 'revensgg';
    }

    updateChannelState();
    renderMessages();
  }

  mediaBtn.addEventListener('click', openMedia);
  homeBtn.addEventListener('click', openHome);

  const usernameStored = localStorage.getItem('ps5-username');
  if (usernameStored) {
    setOwnerCode(getOwnerCode());
  }

  function submitUsername() {
    const value = usernameInput.value.trim();
    if (!value) {
      usernameInput.focus();
      usernameInput.placeholder = 'Please enter a username';
      return;
    }
    localStorage.setItem('ps5-username', value);
    overlay.classList.add('hidden');
    initializeUi();
  }

  saveUsernameBtn.addEventListener('click', submitUsername);
  usernameInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') submitUsername();
  });

  const storedUsername = localStorage.getItem('ps5-username');
  if (storedUsername) {
    localStorage.setItem('ps5-owner-code', getOwnerCode() || '');
    overlay.classList.add('hidden');
    initializeUi();
  } else {
    usernameInput.focus();
  }
</script>
</html>

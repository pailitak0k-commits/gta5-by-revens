<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Theft Auto V</title>
<style>
  :root {
    --bg-1: #04080d;
    --bg-2: #0d1217;
    --panel: rgba(10, 12, 16, 0.85);
    --panel-2: rgba(24, 28, 31, 0.76);
    --line: rgba(255,255,255,0.09);
    --white: #f2f5f8;
    --muted: rgba(255,255,255,0.7);
    --muted-2: rgba(255,255,255,0.52);
    --gold: #e9c55f;
    --green: #6ff27d;
    --blue: #46baff;
    --shadow: rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at top, rgba(70, 186, 255, 0.12), transparent 20%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color: var(--white);
    font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .game-shell {
    position: relative;
    width: min(980px, 100%);
    min-height: 640px;
    background: #05070a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .background-art {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.72) 72%, rgba(0,0,0,0.9)),
      linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.06) 30%, rgba(0,0,0,0.18) 100%),
      url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    filter: saturate(0.8) contrast(1.04) brightness(0.6);
    transform: scale(1.08);
  }

  .screen-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.14) 18%, rgba(0,0,0,0.2) 100%),
      radial-gradient(circle at 20% 24%, rgba(255,255,255,0.12), transparent 25%);
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    background: rgba(3, 5, 7, 0.18);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }

  .brand-mark {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: linear-gradient(135deg, #46baff, #1d5be1);
    position: relative;
    box-shadow: 0 0 18px rgba(70, 186, 255, 0.25);
  }

  .brand-mark::before,
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    background: rgba(255,255,255,0.9);
    border-radius: 1.5px;
  }

  .brand-mark::before { width: 2px; height: 100%; }
  .brand-mark::after { width: 100%; height: 2px; }

  .console-status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7ef9a4;
    box-shadow: 0 0 10px rgba(126,249,164,0.8);
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 24px 22px 18px;
    min-height: 580px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .hero-stage {
    position: relative;
    flex: 1;
  }

  .hero-title {
    position: absolute;
    left: 18px;
    bottom: 125px;
    font-weight: 900;
    font-size: clamp(2.1rem, 3vw, 3.3rem);
    letter-spacing: -0.08em;
    line-height: 0.92;
    text-shadow: 0 10px 30px rgba(0,0,0,0.65);
    max-width: 420px;
  }

  .hero-meta {
    position: absolute;
    left: 18px;
    bottom: 80px;
    display: inline-flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(10,11,14,.35);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }

  .play-button {
    position: absolute;
    left: 18px;
    bottom: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 150px;
    min-height: 46px;
    border-radius: 10px;
    border: 0;
    background: linear-gradient(180deg, #9ae269, #4cd167);
    color: rgba(4, 7, 10, 0.9);
    font: 800 1.02rem/1 system-ui, sans-serif;
    box-shadow: 0 14px 30px rgba(76,209,103,0.35);
    cursor: pointer;
  }

  .side-cards {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: grid;
    gap: 10px;
    width: 180px;
  }

  .mini-card {
    position: relative;
    min-height: 90px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background:
      linear-gradient(180deg, rgba(7,9,12,.1), rgba(7,9,12,.52)),
      url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80') center/cover no-repeat;
    box-shadow: 0 14px 30px rgba(0,0,0,0.28);
  }

  .mini-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.7));
  }

  .mini-card span {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 1;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
  }

  .side-cards .mini-card:nth-child(2) {
    background:
      linear-gradient(180deg, rgba(7,9,12,.18), rgba(7,9,12,.56)),
      url('https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=600&q=80') center/cover no-repeat;
  }

  .bottom-bar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px 12px;
    background: rgba(8, 10, 12, 0.55);
    border-top: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(5px);
  }

  .bottom-left, .bottom-right {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    min-width: 120px;
    color: rgba(255,255,255,0.8);
  }

  .tile .thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7ee5d0, #60a6ff);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.14);
  }

  .tile strong {
    display: block;
    font-size: 0.72rem;
    line-height: 1.1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  .tile small {
    color: rgba(255,255,255,0.62);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
  }

  .text-badge {
    color: rgba(255,255,255,0.9);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .friend-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: rgba(255,255,255,0.8);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .friend-row .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7ef9a4;
    display: inline-block;
  }

  .welcome-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 7, 12, 0.72);
    backdrop-filter: blur(10px);
    z-index: 30;
    padding: 18px;
  }

  .welcome-overlay.hidden { display: none; }

  .welcome-card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, rgba(12,18,24,0.98), rgba(7,10,15,0.98));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px 20px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  .welcome-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(70,186,255,0.12);
    border: 1px solid rgba(70,186,255,0.24);
    color: #7acfff;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 900;
  }

  .welcome-card h2 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 4vw, 2.7rem);
    letter-spacing: -0.08em;
  }

  .welcome-card p {
    margin: 0 0 18px;
    color: rgba(255,255,255,0.72);
  }

  .field {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .field label {
    color: rgba(255,255,255,0.72);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
  }

  .field input {
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    padding: 0 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--white);
    font-weight: 700;
    outline: none;
  }

  .field input:focus {
    border-color: rgba(70,186,255,0.7);
    box-shadow: 0 0 0 3px rgba(70,186,255,0.12);
  }

  .welcome-actions {
    display: flex;
    justify-content: flex-end;
  }

  .primary-btn {
    appearance: none;
    border: 0;
    border-radius: 10px;
    min-height: 44px;
    padding: 0 18px;
    font: 800 0.95rem/1 system-ui, sans-serif;
    cursor: pointer;
    background: linear-gradient(180deg, #7fe2ff, #2a9aff 65%, #2055d6);
    color: #08151f;
    box-shadow: 0 12px 24px rgba(42,154,255,0.28);
  }

  @media (max-width: 760px) {
    .game-shell { min-height: 560px; }
    .side-cards { width: 150px; }
    .bottom-bar { flex-direction: column; align-items: flex-start; }
    .bottom-right { width: 100%; justify-content: flex-start; }
  }
</style>

<div class="welcome-overlay" id="username-overlay">
  <div class="welcome-card">
    <div class="welcome-badge">PS5</div>
    <h2>Welcome</h2>
    <p>Choose a username to personalize your console.</p>
    <div class="field">
      <label for="username-input">Username</label>
      <input id="username-input" type="text" maxlength="18" placeholder="Enter your username" autocomplete="off">
    </div>
    <div class="welcome-actions">
      <button class="primary-btn" id="save-username-btn" type="button">Continue</button>
    </div>
  </div>
</div>

<div class="game-shell">
  <div class="background-art"></div>
  <div class="screen-overlay"></div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>PS5</span>
    </div>
    <div class="console-status">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>

  <div class="content">
    <div class="hero-stage">
      <div class="hero-title">Grand<br>Theft Auto V</div>
      <div class="hero-meta">GTA • Open World</div>
      <button class="play-button" type="button">Spielen</button>

      <div class="side-cards">
        <div class="mini-card"><span>GTA V</span></div>
        <div class="mini-card"><span>Details</span></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <div class="tile">
          <span class="thumb"></span>
          <div>
            <strong>Trophaen</strong>
            <small>3/3</small>
          </div>
        </div>
        <div class="tile">
          <span class="thumb" style="background:linear-gradient(135deg,#f4d870,#e18b2f)"></span>
          <div>
            <strong>Freunde</strong>
            <small>2 online</small>
          </div>
        </div>
      </div>

      <div class="bottom-right">
        <div class="text-badge">Aktivitäten</div>
        <div class="friend-row"><span class="dot"></span> Freunde die spielen</div>
      </div>
    </div>
  </div>
</div>

<script>
  const usernameOverlay = document.getElementById('username-overlay');
  const usernameInput = document.getElementById('username-input');
  const saveUsernameBtn = document.getElementById('save-username-btn');

  function setUsername(value) {
    const name = (value || '').trim() || 'Player';
    localStorage.setItem('ps5-username', name);
  }

  function submitUsername() {
    const value = usernameInput.value;
    if (!value.trim()) {
      usernameInput.focus();
      usernameInput.placeholder = 'Please enter a username';
      return;
    }
    setUsername(value);
    usernameOverlay.classList.add('hidden');
  }

  const storedUsername = localStorage.getItem('ps5-username');
  if (storedUsername) {
    setUsername(storedUsername);
    usernameOverlay.classList.add('hidden');
  } else {
    usernameInput.focus();
  }

  saveUsernameBtn.addEventListener('click', submitUsername);
  usernameInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') submitUsername();
  });
</script>
</html>
